name: Multi-Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            artifact_name: c-export-symbols
            build_path: build/c-export-symbols
          - os: macos-latest
            triplet: arm64-osx
            artifact_name: c-export-symbols
            build_path: build/c-export-symbols
          - os: windows-latest
            triplet: x64-windows
            artifact_name: c-export-symbols.exe
            build_path: build/Release/c-export-symbols.exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with: 
        vcpkgJsonGlob: vcpkg.json 
        vcpkgCommitId: 8f57207a8a1b96a4a864e11f85d57b0a252b3ac3
       

    - name: Configure CMake (Linux)
      run: >
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: c-export-symbols-${{ runner.os }}
        path: ${{ matrix.build_path }}
